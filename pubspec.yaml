name: xenoh_mobile
description: "Xenoh — training & recovery companion (Flutter mobile client)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Material/Cupertino i18n + IME locales (incl. Vietnamese)
    sdk: flutter

  # cookie_jar + dio_cookie_manager: persist the xenoh.refresh HttpOnly cookie.
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  flutter_riverpod: ^3.3.1 # state management / DI
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0 # models
  go_router: ^17.3.0 # navigation
  google_fonts: ^6.2.1 # Fraunces / Inter / JetBrains Mono
  json_annotation: ^4.11.0
  path_provider: ^2.1.4
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.3.0
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  # Pinned below 11.0.0: that version's Android build.gradle assumes AGP>=9
  # always means "built-in Kotlin compiler enabled" and skips applying its
  # own Kotlin plugin — but this project explicitly disables built-in Kotlin
  # (see android/gradle.properties), so file_picker's Kotlin sources never
  # got compiled at all ("cannot find symbol FilePickerPlugin"). 10.3.10 still
  # applies its own `org.jetbrains.kotlin.android` plugin unconditionally,
  # same as every other plugin here. (10.3.11 is retracted on pub.dev — pin
  # exact, no caret, so `pub upgrade` can't silently jump to 11.x again.)
  file_picker: 10.3.10
  emoji_picker_flutter: ^4.4.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  # Local fork (packages/flutter_foreground_task) — adds `largeIconPath`
  # support to NotificationIcon so the ongoing notification can show the
  # current exercise's photo (upstream v9.2.2 has no way to set a bitmap
  # large icon, only a build-time bundled small-icon drawable).
  flutter_foreground_task:
    path: packages/flutter_foreground_task

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  freezed: ^3.2.5
  json_serializable: ^6.11.0
  mocktail: ^1.0.0
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0
  # NOTE: riverpod_lint + custom_lint omitted for now — custom_lint 0.8.1 pins
  # analyzer ^8, which conflicts with freezed/json_serializable (analyzer >=9).
  # Re-add once custom_lint supports analyzer >=9.

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: Fraunces
      fonts:
        # Single variable font (wght 100-900); Flutter/Skia interpolates the
        # weight axis per named instance below. Vietnamese-vetted on Google
        # Fonts, unlike the Namdhinggo font it replaces (Latin + Limbu only).
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/icon/logo_xenoh_transparent.png"
  # Android: adaptive icon (foreground + background) plus legacy fallback.
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FEFBF4"
  adaptive_icon_foreground: "assets/icon/logo_xenoh_transparent.png"
  adaptive_icon_foreground_inset: 24
  # iOS: strips alpha and fills the required sizes.
  ios: true
  remove_alpha_ios: true
