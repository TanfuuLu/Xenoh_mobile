# Xenoh splash screen — dark-brown brand background with the centered X mark.
# Regenerate after edits:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EFE4D5"
  image: assets/icon/xenoh_splash.png

  # Android 12+ uses a separate splash API (centered icon on a solid color).
  android_12:
    color: "#EFE4D5"
    image: assets/icon/xenoh_splash_android12.png

  # Match the system bars to the brand background while the splash shows.
  android: true
  ios: true
  web: false
